<!DOCTYPE html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Yangi parol – RoboSTEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<noscript><style>.nav-auth[data-state] { visibility: visible; }</style></noscript>
<script defer src="js/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/auth.js"></script>
</head>
<body data-page="reset">

<header class="nav">
  <a class="logo" href="index.html">Robo<b>STEAM</b></a>
  <div class="nav-auth" data-auth-nav data-state="loading">
    <a class="nav-login" href="login.html" data-guest>Kirish</a>
    <a class="btn" href="register.html" data-guest>Ro'yxatdan o'tish</a>
    <a class="nav-user" href="dashboard.html" data-user hidden></a>
    <button class="btn ghost" type="button" data-logout data-user hidden>Chiqish</button>
  </div>
</header>

<main class="auth">
  <div class="wrap">
    <section class="auth-card" aria-labelledby="reset-title">
      <div data-step="checking">
        <h1 class="auth-title" id="reset-title">Yangi parol.</h1>
        <p class="auth-sub" role="status">Havola tekshirilmoqda…</p>
        <noscript><p class="auth-sub">Bu sahifa uchun JavaScript yoqilgan bo'lishi kerak.</p></noscript>
      </div>

      <div data-step="form" hidden>
        <h1 class="auth-title" tabindex="-1">Yangi parol o'rnating.</h1>
        <form class="auth-form" id="reset-form" data-auth-form novalidate>
          <p class="form-msg" id="form-msg" aria-live="polite" hidden></p>
          <div class="field">
            <label for="password">Yangi parol</label>
            <div class="pw">
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-hint" required>
              <button class="pw-toggle" type="button" data-pw-toggle aria-controls="password" aria-pressed="false" aria-label="Parolni ko'rsatish">Ko'rsatish</button>
            </div>
            <p class="field-hint" id="password-hint">Kamida 8 ta belgi. Harf va raqamlarni aralashtiring.</p>
          </div>
          <div class="field">
            <label for="password2">Yangi parolni takrorlang</label>
            <div class="pw">
              <input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="72" required>
              <button class="pw-toggle" type="button" data-pw-toggle aria-controls="password2" aria-pressed="false" aria-label="Parolni ko'rsatish">Ko'rsatish</button>
            </div>
          </div>
          <button class="btn blue" type="submit">Parolni saqlash</button>
        </form>
      </div>

      <div data-step="invalid" hidden>
        <h1 class="auth-title" tabindex="-1">Havola ishlamadi.</h1>
        <p class="auth-sub" id="invalid-msg"></p>
        <a class="btn blue" href="forgot-password.html">Yangi havola so'rash</a>
      </div>

      <div data-step="done" hidden>
        <h1 class="auth-title" tabindex="-1">Parol yangilandi.</h1>
        <p class="auth-sub">Endi yangi parolingiz bilan kirasiz.</p>
        <a class="btn blue" href="dashboard.html">Kabinetga o'tish</a>
      </div>
    </section>

    <div class="auth-art" aria-hidden="true">
      <img src="public/frames/poster.png" width="500" height="496" alt="" decoding="async">
    </div>
  </div>
</main>

</body>
</html>
