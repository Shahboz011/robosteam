# Render Blueprint: the RoboSTEAM compile service (compile-service/). The website itself stays on Vercel.
# Render dashboard -> New -> Blueprint -> pick this repo. Details: compile-service/README.md
services:
  - type: web
    name: robosteam-compile
    runtime: docker
    plan: free
    region: frankfurt
    # Paths are from the repo root. (No rootDir: with one set, Render resolved these relative to it.)
    dockerfilePath: ./compile-service/Dockerfile
    dockerContext: ./compile-service
    buildFilter:                          # only changes in compile-service/ trigger a redeploy
      paths:
        - compile-service/**
    healthCheckPath: /api/health
    autoDeploy: true
    # robosteam.uz and www.robosteam.uz are always allowed (server.js). To allow more pages, e.g. a Vercel
    # preview URL, add an ALLOWED_ORIGINS variable (comma-separated) in the Render dashboard.
    envVars:
      - key: RATE_PER_MIN
        value: "30"
