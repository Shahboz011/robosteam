<!DOCTYPE html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Parolni tiklash – RoboSTEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<noscript><style>.nav-auth[data-state] { visibility: visible; }</style></noscript>
<script defer src="js/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/auth.js"></script>
</head>
<body data-page="forgot">

<header class="nav">
  <a class="logo" href="index.html">Robo<b>STEAM</b></a>
  <div class="nav-auth" data-auth-nav data-state="loading">
    <a class="nav-login" href="login.html" data-guest>Kirish</a>
    <a class="btn" href="register.html" data-guest>Ro'yxatdan o'tish</a>
    <a class="nav-user" href="dashboard.html" data-user hidden></a>
    <button class="btn ghost" type="button" data-logout data-user hidden>Chiqish</button>
  </div>
</header>

<main class="auth">
  <div class="wrap">
    <section class="auth-card" aria-labelledby="forgot-title">
      <h1 class="auth-title" id="forgot-title">Parolni tiklash.</h1>
      <p class="auth-sub">Emailingizni kiriting. Yangi parol o'rnatish uchun havola yuboramiz.</p>
      <form class="auth-form" id="forgot-form" data-auth-form novalidate>
        <p class="form-msg" id="form-msg" aria-live="polite" hidden></p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" required>
        </div>
        <button class="btn blue" type="submit">Havolani yuborish</button>
      </form>
      <p class="auth-alt">Parol esingizga tushdimi? <a href="login.html">Kirish</a></p>
    </section>

    <div class="auth-art" aria-hidden="true">
      <img src="public/frames/poster.png" width="500" height="496" alt="" decoding="async">
    </div>
  </div>
</main>

</body>
</html>
