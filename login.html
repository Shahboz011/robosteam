<!DOCTYPE html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kirish – RoboSTEAM</title>
<meta name="description" content="RoboSTEAM hisobingizga kiring.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<noscript><style>.nav-auth[data-state] { visibility: visible; }</style></noscript>
<script defer src="js/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/auth.js"></script>
</head>
<body data-page="login">

<header class="nav">
  <a class="logo" href="index.html">Robo<b>STEAM</b></a>
  <div class="nav-auth" data-auth-nav data-state="loading">
    <a class="nav-login" href="login.html" data-guest>Kirish</a>
    <a class="btn" href="register.html" data-guest>Ro'yxatdan o'tish</a>
    <a class="nav-user" href="dashboard.html" data-user hidden></a>
    <button class="btn ghost" type="button" data-logout data-user hidden>Chiqish</button>
  </div>
</header>

<main class="auth">
  <div class="wrap">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 class="auth-title" id="login-title">Xush kelibsiz.</h1>
      <p class="auth-sub">Darslarni davom ettirish uchun hisobingizga kiring.</p>
      <form class="auth-form" id="login-form" data-auth-form novalidate>
        <p class="form-msg" id="form-msg" aria-live="polite" hidden></p>
        <div id="resend-wrap" hidden>
          <button class="btn ghost" type="button" id="resend-btn">Xatni qayta yuborish</button>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
            <button class="pw-toggle" type="button" data-pw-toggle aria-controls="password" aria-pressed="false" aria-label="Parolni ko'rsatish">Ko'rsatish</button>
          </div>
        </div>
        <p class="auth-row"><a href="forgot-password.html">Parolni unutdingizmi?</a></p>
        <button class="btn blue" type="submit">Kirish</button>
      </form>
      <p class="auth-alt">Hisobingiz yo'qmi? <a href="register.html">Ro'yxatdan o'ting</a></p>
    </section>

    <!-- Astronaut: its bottom is a hard cut, so it sits on the panel's bottom edge (is-peek) -->
    <div class="auth-art is-peek">
      <picture>
        <source type="image/webp" srcset="public/images/astronaut-login-480.webp 480w, public/images/astronaut-login-960.webp 960w" sizes="(max-width: 860px) 220px, 420px">
        <img src="public/images/astronaut-login.png" width="960" height="869" alt="Holografik panelda saqlangan natijalarini tekshirayotgan kosmonavt" decoding="async">
      </picture>
    </div>
  </div>
</main>

</body>
</html>
